<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Tagger — The Final Shot</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', monospace;
    background: #111;
    color: #ccc;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar ─────────────────────── */
  #topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    font-size: 12px;
    flex-shrink: 0;
  }
  #topbar h1 { font-size: 13px; color: #fff; font-weight: normal; letter-spacing: 0.1em; }
  #topbar .sep { color: #444; }
  #queue-info { color: #888; }
  #queue-info span { color: #aaa; }

  .filter-btn {
    padding: 3px 10px; font-size: 11px; font-family: inherit;
    background: #222; border: 1px solid #444; color: #888;
    cursor: pointer; letter-spacing: 0.05em;
  }
  .filter-btn.active { background: #333; border-color: #888; color: #fff; }
  .filter-btn:hover { border-color: #666; color: #ccc; }

  #nav-btns { display: flex; gap: 6px; margin-left: auto; }
  #nav-btns button {
    padding: 4px 12px; font-size: 11px; font-family: inherit;
    background: #222; border: 1px solid #444; color: #888; cursor: pointer;
  }
  #nav-btns button:hover:not(:disabled) { border-color: #666; color: #ccc; }
  #nav-btns button:disabled { opacity: 0.3; cursor: default; }

  /* ── Main layout ─────────────────── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Left: image panel ───────────── */
  #img-panel {
    width: 45%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    border-right: 1px solid #2a2a2a;
    position: relative;
    overflow: hidden;
  }
  #img-panel img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }
  #img-meta {
    position: absolute;
    bottom: 8px; left: 8px;
    font-size: 10px;
    color: #555;
    letter-spacing: 0.05em;
  }
  #img-placeholder {
    color: #333;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-align: center;
  }

  /* ── Right: tag panel ────────────── */
  #tag-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Image info bar */
  #img-info {
    padding: 8px 14px;
    font-size: 11px;
    color: #666;
    background: #161616;
    border-bottom: 1px solid #2a2a2a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }
  #img-info strong { color: #999; }

  /* Sections inside tag panel */
  .section {
    padding: 10px 14px;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
  }
  .section-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 7px;
  }

  /* Current tags */
  #current-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    min-height: 28px;
  }
  .tag-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    font-size: 11px;
    font-family: inherit;
    background: #2a2a2a;
    border: 1px solid #444;
    color: #ccc;
    letter-spacing: 0.03em;
    cursor: default;
  }
  .tag-chip .remove {
    color: #666;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
  }
  .tag-chip .remove:hover { color: #f66; }
  #no-tags { color: #444; font-size: 11px; font-style: italic; }

  /* Completeness */
  #completeness {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .check-item {
    font-size: 10px;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .check-item.ok  { color: #5a5; }
  .check-item.bad { color: #a55; }

  /* Add tag input */
  #add-tag-row { display: flex; gap: 6px; }
  #tag-input {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #ccc;
    font-family: inherit;
    font-size: 12px;
    padding: 5px 8px;
    outline: none;
  }
  #tag-input:focus { border-color: #666; }
  #add-tag-btn {
    padding: 5px 14px;
    background: #222;
    border: 1px solid #444;
    color: #aaa;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 0.08em;
  }
  #add-tag-btn:hover { border-color: #888; color: #fff; }

  /* Vocabulary */
  #vocab-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 0 14px 10px;
  }
  #vocab-scroll::-webkit-scrollbar { width: 4px; }
  #vocab-scroll::-webkit-scrollbar-track { background: #111; }
  #vocab-scroll::-webkit-scrollbar-thumb { background: #333; }

  .vocab-group { margin-top: 12px; }
  .vocab-group-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    color: #555;
    margin-bottom: 6px;
    padding-bottom: 3px;
    border-bottom: 1px solid #222;
  }
  .vocab-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .vocab-tag {
    padding: 2px 7px;
    font-size: 10px;
    font-family: inherit;
    letter-spacing: 0.03em;
    cursor: pointer;
    border: 1px solid #2a2a2a;
    color: #666;
    background: transparent;
    transition: all 0.1s;
  }
  .vocab-tag:hover   { border-color: #555; color: #aaa; }
  .vocab-tag.active  { background: #2a2a2a; border-color: #666; color: #fff; }
  .vocab-tag .cnt    { color: #444; font-size: 9px; margin-left: 2px; }
  .vocab-tag.active .cnt { color: #777; }

  /* Action bar */
  #action-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: #161616;
    border-top: 1px solid #2a2a2a;
    flex-shrink: 0;
  }
  #save-btn {
    padding: 7px 22px;
    background: #2a4a2a;
    border: 1px solid #4a7a4a;
    color: #8fdf8f;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 0.06em;
  }
  #save-btn:hover { background: #3a5a3a; border-color: #6aaa6a; }
  #save-btn:disabled { opacity: 0.4; cursor: default; }
  #skip-btn {
    padding: 7px 16px;
    background: transparent;
    border: 1px solid #333;
    color: #666;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 0.06em;
  }
  #skip-btn:hover { border-color: #555; color: #aaa; }
  #shortcuts {
    margin-left: auto;
    font-size: 10px;
    color: #444;
    letter-spacing: 0.05em;
  }
  #status-msg {
    font-size: 11px;
    color: #5a5;
    min-width: 120px;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <h1>IMAGE TAGGER</h1>
  <span class="sep">·</span>
  <div id="queue-info">Loading…</div>
  <span class="sep">·</span>
  <button class="filter-btn" data-filter="few">Needs tags (&lt;4)</button>
  <button class="filter-btn" data-filter="none">Untagged (0)</button>
  <button class="filter-btn" data-filter="all">All</button>
  <div id="nav-btns">
    <button id="prev-btn" disabled>← Prev</button>
    <button id="next-btn" disabled>Next →</button>
  </div>
</div>

<!-- Main -->
<div id="main">

  <!-- Left: image -->
  <div id="img-panel">
    <div id="img-placeholder">Loading images…</div>
    <img id="preview-img" src="" alt="" style="display:none">
    <div id="img-meta"></div>
  </div>

  <!-- Right: tagging -->
  <div id="tag-panel">

    <div id="img-info">–</div>

    <!-- Current tags -->
    <div class="section">
      <div class="section-label">Current tags</div>
      <div id="current-tags"><span id="no-tags">No tags yet</span></div>
    </div>

    <!-- Completeness -->
    <div class="section">
      <div class="section-label">Completeness</div>
      <div id="completeness">–</div>
    </div>

    <!-- Add tag -->
    <div class="section">
      <div class="section-label">Add tag</div>
      <div id="add-tag-row">
        <input id="tag-input" type="text" placeholder="type a tag and press Enter…" autocomplete="off" spellcheck="false">
        <button id="add-tag-btn">+ Add</button>
      </div>
    </div>

    <!-- Vocabulary -->
    <div id="vocab-scroll">
      <!-- populated by JS -->
    </div>

    <!-- Action bar -->
    <div id="action-bar">
      <span id="status-msg"></span>
      <button id="save-btn" disabled>💾 Save & Next</button>
      <button id="skip-btn">→ Skip</button>
      <span id="shortcuts">S · Save &amp; Next &nbsp;|&nbsp; → · Skip &nbsp;|&nbsp; ← · Back</span>
    </div>

  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   Admin Tagger — frontend logic
   ════════════════════════════════════════════════════════════════ */

let images    = [];  // full queue
let queue     = [];  // filtered queue
let queueIdx  = 0;
let vocabulary = []; // [{tag, count}]
let taxonomy  = {};  // from tag-taxonomy.json
let currentTags = []; // tags being edited for current image
let currentFilter = 'few';

/* ── Boot ─────────────────────────────────────────────────────── */
async function boot() {
  // Load taxonomy config
  try {
    const r = await fetch('/admin/api/taxonomy');
    taxonomy = await r.json();
  } catch (_) { taxonomy = {}; }

  // Load vocabulary
  await refreshVocabulary();

  // Load queue with default filter
  activateFilter('few');
}

async function refreshVocabulary() {
  try {
    const r = await fetch('/admin/api/vocabulary');
    const d = await r.json();
    vocabulary = d.tags || [];
    renderVocabulary();
  } catch (e) {
    console.error('vocabulary error', e);
  }
}

async function loadQueue(filter) {
  document.getElementById('queue-info').textContent = 'Loading…';
  document.getElementById('preview-img').style.display = 'none';
  document.getElementById('img-placeholder').textContent = 'Loading…';
  document.getElementById('img-placeholder').style.display = 'block';

  try {
    const r = await fetch('/admin/api/images?filter=' + filter);
    const d = await r.json();
    queue    = d.images || [];
    queueIdx = 0;
    updateQueueInfo();
    if (queue.length > 0) showImage(0);
    else {
      document.getElementById('img-placeholder').textContent = '✓ All images tagged in this filter.';
      document.getElementById('img-info').textContent = '–';
      currentTags = [];
      renderCurrentTags();
      renderCompleteness();
      document.getElementById('save-btn').disabled = true;
    }
  } catch (e) {
    document.getElementById('img-placeholder').textContent = 'Error loading images.';
    console.error(e);
  }
}

function activateFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === filter);
  });
  loadQueue(filter);
}

/* ── Image display ────────────────────────────────────────────── */
function showImage(idx) {
  if (idx < 0 || idx >= queue.length) return;
  queueIdx = idx;
  const img = queue[idx];

  // Image preview
  const el = document.getElementById('preview-img');
  const placeholder = document.getElementById('img-placeholder');
  placeholder.style.display = 'none';
  el.style.display = 'block';
  el.src = img.secure_url;

  // Metadata
  document.getElementById('img-meta').textContent =
    img.public_id + (img.folder ? '  ·  ' + img.folder : '');
  document.getElementById('img-info').innerHTML =
    '<strong>' + img.public_id + '</strong>' +
    '  ·  ' + img.width + '×' + img.height +
    (img.folder ? '  ·  ' + img.folder : '') +
    '  ·  ' + img.tags.length + ' existing tags';

  // Edit tags (copy so we don't mutate original until save)
  currentTags = [...img.tags];
  renderCurrentTags();
  renderCompleteness();
  renderVocabulary(); // re-render to update active states

  updateNavButtons();
  updateQueueInfo();
  document.getElementById('save-btn').disabled = false;
  document.getElementById('status-msg').textContent = '';
}

function updateQueueInfo() {
  const el = document.getElementById('queue-info');
  if (queue.length === 0) {
    el.innerHTML = 'No images in this filter';
  } else {
    el.innerHTML = 'Image <span>' + (queueIdx + 1) + ' of ' + queue.length + '</span>';
  }
}

function updateNavButtons() {
  document.getElementById('prev-btn').disabled = queueIdx <= 0;
  document.getElementById('next-btn').disabled = queueIdx >= queue.length - 1;
}

/* ── Tag editing ──────────────────────────────────────────────── */
function addTag(raw) {
  const tag = raw.trim().toLowerCase().replace(/\s+/g, '_');
  if (!tag || currentTags.includes(tag)) return;
  currentTags.push(tag);
  renderCurrentTags();
  renderCompleteness();
  renderVocabulary();
}

function removeTag(tag) {
  currentTags = currentTags.filter(t => t !== tag);
  renderCurrentTags();
  renderCompleteness();
  renderVocabulary();
}

function toggleTag(tag) {
  if (currentTags.includes(tag)) removeTag(tag);
  else addTag(tag);
}

/* ── Render current tags ──────────────────────────────────────── */
function renderCurrentTags() {
  const el = document.getElementById('current-tags');
  el.innerHTML = '';
  if (currentTags.length === 0) {
    el.innerHTML = '<span id="no-tags">No tags yet</span>';
    return;
  }
  currentTags.forEach(tag => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.innerHTML = tag + ' <span class="remove" data-tag="' + tag + '">×</span>';
    el.appendChild(chip);
  });
  // Remove clicks
  el.querySelectorAll('.remove').forEach(btn => {
    btn.addEventListener('click', () => removeTag(btn.dataset.tag));
  });
}

/* ── Completeness check ───────────────────────────────────────── */
function renderCompleteness() {
  const el = document.getElementById('completeness');
  // Build a set of all tags in each taxonomy group
  const grouped = {};
  Object.entries(taxonomy).forEach(([groupKey, group]) => {
    if (groupKey.startsWith('_')) return;
    grouped[groupKey] = new Set(group.tags || []);
  });

  const checks = [
    { key: 'where', label: 'Where' },
    { key: 'what',  label: 'What'  },
    { key: 'mood',  label: 'Mood'  },
    { key: 'how',   label: 'How'   },
  ];

  el.innerHTML = checks.map(c => {
    const group = grouped[c.key];
    if (!group) return '';
    const hasOne = currentTags.some(t => group.has(t));
    return '<span class="check-item ' + (hasOne ? 'ok' : 'bad') + '">' +
      (hasOne ? '✓' : '✗') + ' ' + c.label + '</span>';
  }).join('');
}

/* ── Vocabulary panel ─────────────────────────────────────────── */
function renderVocabulary() {
  const container = document.getElementById('vocab-scroll');
  container.innerHTML = '';

  // Build a map from tag → count
  const countMap = {};
  vocabulary.forEach(v => { countMap[v.tag] = v.count; });

  // Track which tags are already placed in a taxonomy group
  const placed = new Set();

  // Render taxonomy groups
  Object.entries(taxonomy).forEach(([groupKey, group]) => {
    if (groupKey.startsWith('_')) return;
    const tags = (group.tags || []).filter(t => countMap[t] !== undefined);
    if (tags.length === 0) return;

    const div = document.createElement('div');
    div.className = 'vocab-group';
    div.innerHTML = '<div class="vocab-group-label">' + (group.label || groupKey) + '</div>';
    const tagDiv = document.createElement('div');
    tagDiv.className = 'vocab-tags';

    tags.forEach(tag => {
      placed.add(tag);
      tagDiv.appendChild(makeVocabTag(tag, countMap[tag] || 0));
    });

    div.appendChild(tagDiv);
    container.appendChild(div);
  });

  // "Other" group — tags in the library but not in any taxonomy group
  const otherTags = vocabulary.filter(v => !placed.has(v.tag));
  if (otherTags.length > 0) {
    const div = document.createElement('div');
    div.className = 'vocab-group';
    div.innerHTML = '<div class="vocab-group-label">🏷 Other (in library)</div>';
    const tagDiv = document.createElement('div');
    tagDiv.className = 'vocab-tags';
    otherTags.forEach(v => {
      tagDiv.appendChild(makeVocabTag(v.tag, v.count));
    });
    div.appendChild(tagDiv);
    container.appendChild(div);
  }
}

function makeVocabTag(tag, count) {
  const btn = document.createElement('button');
  btn.className = 'vocab-tag' + (currentTags.includes(tag) ? ' active' : '');
  btn.innerHTML = tag + '<span class="cnt">·' + count + '</span>';
  btn.addEventListener('click', () => toggleTag(tag));
  return btn;
}

/* ── Save ─────────────────────────────────────────────────────── */
async function saveAndNext() {
  if (queue.length === 0) return;
  const img = queue[queueIdx];
  const btn = document.getElementById('save-btn');
  const msg = document.getElementById('status-msg');

  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    const r = await fetch('/admin/api/save-tags', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ public_id: img.public_id, tags: currentTags })
    });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'save failed');

    // Update the image in our local queue
    queue[queueIdx].tags = [...currentTags];
    msg.textContent = '✓ Saved';
    msg.style.color = '#5a5';

    // Refresh vocabulary counts (async, don't block)
    refreshVocabulary();

    // Advance to next image
    setTimeout(() => {
      if (queueIdx < queue.length - 1) showImage(queueIdx + 1);
      else {
        msg.textContent = '✓ All done!';
        btn.disabled = false;
        btn.textContent = '💾 Save & Next';
      }
    }, 300);

  } catch (e) {
    msg.textContent = '✗ Error: ' + e.message;
    msg.style.color = '#a55';
    btn.disabled = false;
    btn.textContent = '💾 Save & Next';
    console.error('[save-tags]', e);
  }
}

/* ── Event listeners ──────────────────────────────────────────── */
document.getElementById('prev-btn').addEventListener('click', () => {
  if (queueIdx > 0) showImage(queueIdx - 1);
});
document.getElementById('next-btn').addEventListener('click', () => {
  if (queueIdx < queue.length - 1) showImage(queueIdx + 1);
});
document.getElementById('skip-btn').addEventListener('click', () => {
  if (queueIdx < queue.length - 1) showImage(queueIdx + 1);
});
document.getElementById('save-btn').addEventListener('click', saveAndNext);

document.getElementById('add-tag-btn').addEventListener('click', () => {
  const inp = document.getElementById('tag-input');
  if (inp.value.trim()) { addTag(inp.value); inp.value = ''; }
});
document.getElementById('tag-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const inp = e.target;
    if (inp.value.trim()) { addTag(inp.value); inp.value = ''; }
  }
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => activateFilter(btn.dataset.filter));
});

// Keyboard shortcuts (when not focused on the input)
document.addEventListener('keydown', e => {
  if (document.activeElement === document.getElementById('tag-input')) return;
  if (e.key === 's' || e.key === 'S') { e.preventDefault(); saveAndNext(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); if (queueIdx < queue.length - 1) showImage(queueIdx + 1); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); if (queueIdx > 0) showImage(queueIdx - 1); }
});

/* ── Taxonomy endpoint (served from admin routes) ─────────────── */
// We load it from a static JSON file served by the admin routes

/* ── Start ────────────────────────────────────────────────────── */
boot();
</script>
</body>
</html>
